<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP管家宠 · 神兽形态 UI 三套对照</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #e6e8ec;
      --orange: #f97316;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 20px 24px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    nav a {
      text-decoration: none;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }
    nav a:hover, nav a.active { background: #fff7ed; border-color: #fdba74; color: #c2410c; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
    section { margin-bottom: 36px; }
    h2 {
      font-size: 16px;
      margin: 0 0 8px;
      padding-top: 8px;
    }
    .note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    figure {
      margin: 0 0 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: #eee;
    }
    figcaption {
      padding: 12px 16px 14px;
      font-size: 13px;
      color: var(--muted);
    }
    figcaption strong { color: var(--ink); font-size: 14px; }
    .stages { margin-top: 4px; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px 16px 32px;
    }
  </style>
</head>
<body>
  <header>
    <h1>VIP管家宠 · 神兽形态 UI 三套对照</h1>
    <p class="sub">6 种菲律宾神话神兽 × 6 档形态（幼宠→银徽→管家→金甲→翼宠→冠宠）。演示开局 VIP3 = 金甲。本页为方案图，非付费、非猫狗。</p>
    <nav>
      <a href="#neutral">中性（第一套）</a>
      <a href="#sacred">神圣</a>
      <a href="#cute">可爱</a>
    </nav>
  </header>
  <main>
    <section id="neutral">
      <h2>中性 · 第一套</h2>
      <p class="note">偏产品中性立绘，介于神圣与可爱之间，适合先做对照。</p>
      <figure>
        <img src="神兽形态UI/sarimanok-forms-ui.png" alt="彩羽神鸟 中性 六档">
        <figcaption><strong>彩羽神鸟 · Sarimanok</strong><div class="stages">幼羽彩鸟 → 银徽彩羽 → 管家彩鸟 → 金甲彩羽 → 翼彩神鸟 → 冠羽吉祥鸟</div></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/bakunawa-forms-ui.png" alt="月食神龙 中性 六档">
        <figcaption><strong>月食神龙 · Bakunawa</strong><div class="stages">月卵幼龙 → 银徽月蛟 → 管家月蛇 → 金甲月龙 → 翼月神龙 → 冠月食神龙</div></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/diwata-forms-ui.png" alt="山林精灵 中性 六档">
        <figcaption><strong>山林精灵 · Diwata</strong><div class="stages">幼芽精灵 → 银徽林灵 → 管家山林 → 金甲灵光 → 翼林精灵 → 冠山林精灵</div></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/tigmamanukan-forms-ui.png" alt="吉兆灵鸟 中性 六档">
        <figcaption><strong>吉兆灵鸟 · Tigmamanukan</strong><div class="stages">幼兆灵鸟 → 银徽吉兆 → 管家灵鸟 → 金甲兆羽 → 翼吉兆鸟 → 冠Bathala灵鸟</div></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/sirena-forms-ui.png" alt="海之仙女 中性 六档">
        <figcaption><strong>海之仙女 · Sirena</strong><div class="stages">幼浪海仙 → 银徽海珠 → 管家海灵 → 金甲海仙 → 翼潮仙女 → 冠海之仙女</div></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/kapre-forms-ui.png" alt="树精守护神 中性 六档">
        <figcaption><strong>树精守护神 · Kapre</strong><div class="stages">幼芽树精 → 银徽树灵 → 管家树精 → 金甲树卫 → 翼林树神 → 冠树精守护神</div></figcaption>
      </figure>
    </section>

    <section id="sacred">
      <h2>神圣</h2>
      <p class="note">庙宇金纹、光环、祭礼感，更贴合菲律宾神灵信仰气质。</p>
      <figure>
        <img src="神兽形态UI/神圣/sarimanok-sacred-ui.png" alt="彩羽神鸟 神圣 六档">
        <figcaption><strong>彩羽神鸟 · 神圣</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/神圣/bakunawa-sacred-ui.png" alt="月食神龙 神圣 六档">
        <figcaption><strong>月食神龙 · 神圣</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/神圣/diwata-sacred-ui.png" alt="山林精灵 神圣 六档">
        <figcaption><strong>山林精灵 · 神圣</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/神圣/tigmamanukan-sacred-ui.png" alt="吉兆灵鸟 神圣 六档">
        <figcaption><strong>吉兆灵鸟 · 神圣</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/神圣/sirena-sacred-ui.png" alt="海之仙女 神圣 六档">
        <figcaption><strong>海之仙女 · 神圣</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/神圣/kapre-sacred-ui.png" alt="树精守护神 神圣 六档">
        <figcaption><strong>树精守护神 · 神圣</strong></figcaption>
      </figure>
    </section>

    <section id="cute">
      <h2>可爱</h2>
      <p class="note">Q 版圆身、大眼睛，更适合每天回来抚养的粘性。</p>
      <figure>
        <img src="神兽形态UI/可爱/sarimanok-cute-ui.png" alt="彩羽神鸟 可爱 六档">
        <figcaption><strong>彩羽神鸟 · 可爱</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/可爱/bakunawa-cute-ui.png" alt="月食神龙 可爱 六档">
        <figcaption><strong>月食神龙 · 可爱</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/可爱/diwata-cute-ui.png" alt="山林精灵 可爱 六档">
        <figcaption><strong>山林精灵 · 可爱</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/可爱/tigmamanukan-cute-ui.png" alt="吉兆灵鸟 可爱 六档">
        <figcaption><strong>吉兆灵鸟 · 可爱</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/可爱/sirena-cute-ui.png" alt="海之仙女 可爱 六档">
        <figcaption><strong>海之仙女 · 可爱</strong></figcaption>
      </figure>
      <figure>
        <img src="神兽形态UI/可爱/kapre-cute-ui.png" alt="树精守护神 可爱 六档">
        <figcaption><strong>树精守护神 · 可爱</strong></figcaption>
      </figure>
    </section>
  </main>
  <footer>VIP管家宠 · 冲档版 · 方案图册保存在仓库 docs/ 内，关电脑后用下面「本机永久入口」仍可打开。</footer>
</body>
</html>
